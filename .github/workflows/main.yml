
name: Android 15 Cloud VNC with Play Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-cloud:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      AVD_NAME: CloudAndroid15
      SDK_CACHE_KEY: android-sdk-api35-google-play-x86_64-v4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Android SDK Cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-api35-google-play-x86_64-v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget unzip curl git \
            xvfb openbox x11vnc \
            novnc websockify \
            net-tools netcat-openbsd \
            libpulse0 libx11-6 libxcb1 \
            libxcomposite1 libxcursor1 \
            libxi6 libxtst6 libnss3 \
            libasound2t64

      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          if [ ! -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            cd "$RUNNER_TEMP"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q commandlinetools-linux-13114758_latest.zip

            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            mv cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          fi

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "emulator" \
            "system-images;android-35;google_apis_playstore;x86_64"

      - name: Save Android SDK Cache
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-api35-google-play-x86_64-v4

      - name: Configure KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM available"
          else
            echo "KVM not available"
          fi

      - name: Create Android 15 Play Store AVD
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          mkdir -p "$HOME/.android/avd"

          echo "no" | avdmanager create avd \
            -n "$AVD_NAME" \
            -k "system-images;android-35;google_apis_playstore;x86_64" \
            -d pixel_2 \
            --force

          AVD_CONFIG="$HOME/.android/avd/${AVD_NAME}.avd/config.ini"

          cat >> "$AVD_CONFIG" <<'EOF'
          hw.lcd.width=720
          hw.lcd.height=1280
          hw.lcd.density=240
          hw.ramSize=4096
          hw.cpu.ncore=4
          vm.heapSize=512
          hw.keyboard=yes
          disk.dataPartition.size=8G
          showDeviceFrame=no
          EOF

      - name: Start Desktop Display
        run: |
          export DISPLAY=:0

          Xvfb :0 -screen 0 1280x1400x24 &
          sleep 3

          openbox &
          sleep 2

      - name: Start Android Emulator
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          nohup emulator \
            -avd "$AVD_NAME" \
            -accel auto \
            -gpu swiftshader_indirect \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -netfast \
            -memory 4096 \
            -cores 4 \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/emulator.pid"

          echo "Waiting for emulator..."

          adb wait-for-device

          for i in $(seq 1 120); do
            BOOT_STATUS=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')

            if [ "$BOOT_STATUS" = "1" ]; then
              echo "Android boot completed"
              break
            fi

            sleep 5
          done

          if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; then
            echo "Android boot failed"
            tail -100 "$RUNNER_TEMP/emulator.log"
            exit 1
          fi

          adb shell wm size 720x1280
          adb shell wm density 240
          adb shell settings put system screen_off_timeout 2147483647

          adb shell input keyevent 82 || true

      - name: Install APK Files
        continue-on-error: true
        run: |
          if [ -d "apks" ]; then
            for APK in apks/*.apk; do
              [ -f "$APK" ] || continue

              echo "Installing: $APK"

              if ! adb install -r "$APK"; then
                echo "Warning: APK installation failed: $APK"
              fi
            done
          else
            echo "No apks folder found. Skipping APK installation."
          fi

      - name: Configure VNC Password
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if [ -z "$VNC_PASSWORD" ]; then
            echo "VNC_PASSWORD secret is missing"
            exit 1
          fi

          mkdir -p "$HOME/.vnc"

          x11vnc -storepasswd \
            "$VNC_PASSWORD" \
            "$HOME/.vnc/passwd"

          chmod 600 "$HOME/.vnc/passwd"

      - name: Start VNC Server
        run: |
          export DISPLAY=:0

          nohup x11vnc \
            -display :0 \
            -rfbauth "$HOME/.vnc/passwd" \
            -localhost \
            -rfbport 5900 \
            -forever \
            -shared \
            -noxdamage \
            > "$RUNNER_TEMP/vnc.log" 2>&1 &

          sleep 3

          if ! nc -z 127.0.0.1 5900; then
            echo "VNC server failed"
            cat "$RUNNER_TEMP/vnc.log"
            exit 1
          fi

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: android-cloud-${{ github.run_id }}

      - name: Start noVNC
        run: |
          TS_IP=$(tailscale ip -4)

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP not found"
            exit 1
          fi

          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"

          nohup websockify \
            --web=/usr/share/novnc \
            "${TS_IP}:6080" \
            127.0.0.1:5900 \
            > "$RUNNER_TEMP/novnc.log" 2>&1 &

          sleep 5

          if ! nc -z "$TS_IP" 6080; then
            echo "noVNC failed"
            cat "$RUNNER_TEMP/novnc.log"
            exit 1
          fi

          echo "=================================="
          echo "ANDROID 15 CLOUD VNC READY"
          echo "=================================="
          echo "noVNC URL: http://${TS_IP}:6080/vnc.html"
          echo "VNC Port: 5900"
          echo "Android: API 35"
          echo "Google Play Store: Enabled"
          echo "=================================="

      - name: Health Check
        run: |
          echo "Checking Android, VNC and noVNC..."

          adb devices
          adb shell getprop ro.build.version.release
          adb shell pm list packages | grep -i vending || true

          nc -z 127.0.0.1 5900
          nc -z "$TS_IP" 6080

          echo "All services are running."

      - name: Keep Cloud Android Running
        run: |
          while true; do
            echo "[$(date)] Android Cloud Status"

            if ! adb get-state >/dev/null 2>&1; then
              echo "ADB disconnected"
            fi

            if ! nc -z 127.0.0.1 5900; then
              echo "VNC server is down"
            fi

            if ! nc -z "$TS_IP" 6080; then
              echo "noVNC server is down"
            fi

            sleep 60
          done
